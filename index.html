<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>カニ・クリーム・コロッケ アセット調整ツール</title>
<style>
:root{--bg:#f5f2eb;--panel:#fffdf8;--ink:#2d2925;--muted:#716b63;--line:#d9d2c7;--accent:#e65a2f;--accent2:#f4b23a;--blue:#2e79c7;--green:#459b62;--shadow:0 10px 30px #382d2117}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;overflow:hidden}
button,input,select{font:inherit} button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:var(--ink)} button:hover{border-color:#aaa} button.primary{background:var(--accent);color:white;border-color:var(--accent)} button.good{background:var(--green);color:white;border-color:var(--green)} button.warn{background:var(--accent2);border-color:var(--accent2)} button.small{padding:5px 8px;font-size:12px;border-radius:8px}.danger{color:#b92929}
.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0000000a;z-index:3}.brand{font-weight:900;white-space:nowrap}.tabs{display:flex;gap:6px}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}
.main{min-height:0;display:grid;grid-template-columns:300px minmax(430px,1fr) 330px;gap:10px;padding:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:0;overflow:hidden}.panel h3{margin:0;font-size:14px}.panelhead{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#fff}.scroll{height:calc(100% - 44px);overflow:auto;padding:10px}.section{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}.section h4{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.row{display:flex;gap:7px;align-items:center;margin:7px 0}.row>label{font-size:12px;color:var(--muted);min-width:68px}.row input[type="range"]{flex:1}.row input[type="number"],.row input[type="text"],.row select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff}.value{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:42px;text-align:right}.btns{display:flex;flex-wrap:wrap;gap:6px}.src-item,.asset-item,.layer-item{display:flex;align-items:center;gap:8px;padding:7px;border-radius:9px;border:1px solid transparent;margin-bottom:5px}.src-item:hover,.asset-item:hover,.layer-item:hover{background:#f7f3eb}.src-item.active,.asset-item.active,.layer-item.active{background:#fff1e9;border-color:#f0b39c}.thumb{width:46px;height:46px;border-radius:8px;background:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;object-fit:contain;border:1px solid #ddd}.meta{min-width:0;flex:1}.meta b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{font-size:10px;color:var(--muted)}
.center{display:grid;grid-template-rows:44px 1fr;min-height:0}.canvaswrap{position:relative;min-height:0;background:#d9d5cd;overflow:hidden}.canvaswrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:12px;bottom:12px;padding:7px 10px;background:#25221fcc;color:white;border-radius:9px;font-size:11px;pointer-events:none}.floating{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.mode-crop .composer-only,.mode-compose .crop-only{display:none!important}.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.asset-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;min-width:0}.asset-card img{width:100%;height:78px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/12px 12px;border-radius:7px}.asset-card b{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.layer-handle{font-size:16px;color:#aaa}.layer-actions{display:flex;gap:3px}.badge{display:inline-block;font-size:10px;padding:2px 5px;border-radius:5px;background:#eee;color:#555;margin-left:5px}.drop{border:2px dashed #bbb;border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:12px}.drop.drag{border-color:var(--accent);background:#fff3ec}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#24211e;color:white;padding:9px 13px;border-radius:10px;font-size:12px;z-index:20;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;bottom:26px}
@media(max-width:950px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr;grid-template-rows:auto 70vh auto}.panel{min-height:380px}.topbar{position:sticky;top:0;flex-wrap:wrap;height:auto}.status{display:none}}
</style>
</head>
<body class="mode-crop">
<div class="app">
  <header class="topbar">
    <div class="brand">🦀 アセット調整ツール</div>
    <div class="tabs"><button class="tab active" id="tabCrop">① 切り抜き</button><button class="tab" id="tabCompose">② 料理プレビュー</button></div>
    <div class="spacer"></div>
    <button id="saveProject">プロジェクト保存</button><button id="loadProjectBtn">読込</button><input id="loadProject" type="file" accept="application/json" hidden>
    <button class="primary" id="exportGame">ゲーム用ZIP</button>
    <div class="status" id="status">準備完了</div>
  </header>
  <main class="main">
    <aside class="panel">
      <div class="panelhead"><h3 class="crop-only">素材元</h3><h3 class="composer-only">切り抜き済み素材</h3><button class="small crop-only" id="uploadBtn">画像追加</button><input id="uploadInput" type="file" accept="image/*" multiple hidden></div>
      <div class="scroll crop-only">
        <div id="sourceList"></div>
        <div class="section">
          <h4>切り抜き方式</h4>
          <div class="btns"><button class="small tool active" data-tool="rect">矩形</button><button class="small tool" data-tool="polygon">多角形</button><button class="small tool" data-tool="free">フリーハンド</button><button class="small tool" data-tool="pan">移動</button></div>
          <div class="row"><label>余白</label><input id="cropPadding" type="range" min="0" max="80" value="8"><span class="value" id="padVal">8px</span></div>
          <div class="row"><label>透過閾値</label><input id="alphaThreshold" type="range" min="1" max="200" value="18"><span class="value" id="alphaVal">18</span></div>
          <div class="btns"><button id="autoDetect" class="warn">透過から自動分割</button><button id="clearSelection">選択解除</button></div>
        </div>
        <div class="section">
          <h4>現在の切り抜き</h4>
          <div class="row"><label>素材名</label><input id="assetName" type="text" placeholder="例: fill_crab"></div>
          <div class="btns"><button class="good" id="registerCrop">素材として登録</button><button id="downloadCrop">PNG保存</button></div>
          <div style="font-size:11px;color:var(--muted);margin-top:8px">多角形: クリックで点追加 → ダブルクリック/Enterで確定。フリーハンド: ドラッグで囲む。</div>
        </div>
        <div class="section"><h4>自動検出候補</h4><div id="detectedList" class="asset-grid"></div></div>
      </div>
      <div class="scroll composer-only">
        <div class="section"><div class="drop" id="assetDrop">ここへ画像をドロップして素材追加<br><span style="font-size:10px">PNG / WebP 推奨</span></div><input id="assetUpload" type="file" accept="image/*" multiple hidden><button id="assetUploadBtn" style="width:100%;margin-top:6px">素材画像を追加</button></div>
        <div id="assetLibrary" class="asset-grid"></div>
      </div>
    </aside>

    <section class="panel center">
      <div class="panelhead"><h3 id="canvasTitle">切り抜きプレビュー</h3><div class="btns"><button class="small" id="fitView">全体表示</button><button class="small composer-only" id="resetDish">配置リセット</button></div></div>
      <div class="canvaswrap" id="canvasWrap"><canvas id="mainCanvas"></canvas><div class="floating crop-only"><button class="small" id="zoomOut">−</button><button class="small" id="zoomIn">＋</button></div><div class="hint" id="hint">ドラッグして矩形を作成</div></div>
    </section>

    <aside class="panel">
      <div class="panelhead"><h3 class="crop-only">切り抜き情報</h3><h3 class="composer-only">レイヤー調整</h3></div>
      <div class="scroll crop-only">
        <div class="section"><h4>操作</h4><div class="row"><label>ズーム</label><input id="zoomRange" type="range" min="10" max="500" value="100"><span class="value" id="zoomVal">100%</span></div><div class="row"><label>X</label><span id="selX">-</span></div><div class="row"><label>Y</label><span id="selY">-</span></div><div class="row"><label>幅</label><span id="selW">-</span></div><div class="row"><label>高さ</label><span id="selH">-</span></div></div>
        <div class="section"><h4>便利機能</h4><div class="btns"><button id="trimAlpha">透明余白を詰める</button><button id="invertMask">選択反転</button></div></div>
      </div>
      <div class="scroll composer-only">
        <div class="section">
          <h4>料理キャンバス</h4>
          <div class="row"><label>幅</label><input id="dishW" type="number" min="128" max="2048" value="768"></div><div class="row"><label>高さ</label><input id="dishH" type="number" min="128" max="2048" value="768"></div>
          <div class="row"><label>背景</label><select id="bgMode"><option value="checker">透過</option><option value="white">白</option><option value="dark">濃色</option></select></div>
        </div>
        <div class="section"><h4>レイヤー一覧 <span class="badge" id="layerCount">0</span></h4><div id="layerList"></div></div>
        <div class="section" id="layerEditor">
          <h4>選択レイヤー</h4>
          <div class="row"><label>名前</label><input id="layerName" type="text"></div>
          <div class="row"><label>X</label><input id="layerX" type="range" min="-600" max="1400" value="0"><span class="value" id="layerXVal">0</span></div>
          <div class="row"><label>Y</label><input id="layerY" type="range" min="-600" max="1400" value="0"><span class="value" id="layerYVal">0</span></div>
          <div class="row"><label>拡大率</label><input id="layerScale" type="range" min="5" max="400" value="100"><span class="value" id="layerScaleVal">100%</span></div>
          <div class="row"><label>回転</label><input id="layerRot" type="range" min="-180" max="180" value="0"><span class="value" id="layerRotVal">0°</span></div>
          <div class="row"><label>透明度</label><input id="layerOpacity" type="range" min="0" max="100" value="100"><span class="value" id="layerOpacityVal">100%</span></div>
          <div class="row"><label>左右反転</label><input id="layerFlip" type="checkbox"></div>
          <div class="btns"><button id="layerUp">前へ</button><button id="layerDown">後ろへ</button><button id="dupLayer">複製</button><button id="delLayer" class="danger">削除</button></div>
        </div>
        <div class="section">
          <h4>パターン保存</h4>
          <div class="row"><label>パターン名</label><input id="recipeName" type="text" placeholder="crab_cream_normal"></div>
          <div class="btns"><button id="saveRecipe" class="good">現在配置を保存</button><button id="exportPng">完成PNG</button></div>
          <select id="recipeList" style="width:100%;margin-top:7px;padding:7px;border:1px solid var(--line);border-radius:8px"><option value="">保存済みパターン...</option></select>
        </div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#mainCanvas'), ctx=canvas.getContext('2d',{willReadFrequently:true}), wrap=$('#canvasWrap');
const state={mode:'crop',sources:[],source:null,view:{scale:1,x:0,y:0},tool:'rect',selection:null,poly:[],free:[],drawing:false,detected:[],assets:[],layers:[],selectedLayer:null,recipes:{},dish:{w:768,h:768,bg:'checker'},dragLayer:null,projectVersion:1};
const builtins=[['croquette_parts.png','コロッケ本体・皿・焦げ等'],['fillings.png','液体・具材'],['specials.png','足・DJグッズ・演出']];
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function status(t){$('#status').textContent=t}
function resize(){const r=wrap.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));draw()}
addEventListener('resize',resize);
function imgFrom(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
async function init(){for(const [f,name] of builtins){const img=await imgFrom('assets/'+f);state.sources.push({id:'src_'+crypto.randomUUID(),name,file:f,img,url:'assets/'+f});} state.source=state.sources[0];renderSources();fitSource();resize();status('内蔵素材を読み込みました')}
function setMode(m){state.mode=m;document.body.className='mode-'+m;$('#tabCrop').classList.toggle('active',m==='crop');$('#tabCompose').classList.toggle('active',m==='compose');$('#canvasTitle').textContent=m==='crop'?'切り抜きプレビュー':'料理プレビュー';$('#hint').textContent=m==='crop'?toolHint():'素材をクリックして追加 / レイヤーをドラッグして移動';if(m==='compose') fitDish(); else fitSource();draw()}
$('#tabCrop').onclick=()=>setMode('crop');$('#tabCompose').onclick=()=>setMode('compose');
function renderSources(){const box=$('#sourceList');box.innerHTML='';state.sources.forEach(s=>{const d=document.createElement('div');d.className='src-item'+(s===state.source?' active':'');d.innerHTML=`<img class="thumb" src="${s.img.src}"><div class="meta"><b>${esc(s.name)}</b><span>${s.img.naturalWidth}×${s.img.naturalHeight}</span></div>`;d.onclick=()=>{state.source=s;state.selection=null;state.poly=[];state.free=[];renderSources();fitSource();draw()};box.appendChild(d)})}
function fitSource(){if(!state.source)return;const r=wrap.getBoundingClientRect(),im=state.source.img;const s=Math.min((r.width-30)/im.naturalWidth,(r.height-30)/im.naturalHeight);state.view.scale=s;state.view.x=(r.width-im.naturalWidth*s)/2;state.view.y=(r.height-im.naturalHeight*s)/2;updateZoomUI();draw()}
function fitDish(){const r=wrap.getBoundingClientRect();const s=Math.min((r.width-40)/state.dish.w,(r.height-40)/state.dish.h);state.view.scale=s;state.view.x=(r.width-state.dish.w*s)/2;state.view.y=(r.height-state.dish.h*s)/2;updateZoomUI();draw()}
function updateZoomUI(){const p=Math.round(state.view.scale*100);$('#zoomRange').value=Math.max(10,Math.min(500,p));$('#zoomVal').textContent=p+'%'}
function draw(){ctx.save();ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);if(state.mode==='crop')drawCrop();else drawCompose();ctx.restore()}
function checker(x,y,w,h,size=16){ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.fillStyle='#e9e9e9';for(let yy=0;yy<h;yy+=size)for(let xx=0;xx<w;xx+=size)if(((xx/size+yy/size)&1)===0)ctx.fillRect(x+xx,y+yy,Math.min(size,w-xx),Math.min(size,h-yy))}
function drawCrop(){if(!state.source)return;const {img}=state.source,{scale:s,x,y}=state.view;checker(x,y,img.naturalWidth*s,img.naturalHeight*s,12);ctx.drawImage(img,x,y,img.naturalWidth*s,img.naturalHeight*s);ctx.lineWidth=2;ctx.strokeStyle='#ff552f';ctx.fillStyle='#ff552f22';if(state.selection){const p=selectionScreenPath(state.selection);ctx.save();ctx.beginPath();pathToCtx(p);ctx.fill();ctx.stroke();ctx.restore()} if(state.tool==='polygon'&&state.poly.length){ctx.beginPath();state.poly.forEach((p,i)=>{const q=imgToScreen(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();for(const p of state.poly){const q=imgToScreen(p);ctx.beginPath();ctx.arc(q.x,q.y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke()}} if(state.tool==='free'&&state.free.length){ctx.beginPath();state.free.forEach((p,i)=>{const q=imgToScreen(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}}
function drawCompose(){const {scale:s,x,y}=state.view,w=state.dish.w,h=state.dish.h;if(state.dish.bg==='checker')checker(x,y,w*s,h*s,16);else{ctx.fillStyle=state.dish.bg==='white'?'#fff':'#292625';ctx.fillRect(x,y,w*s,h*s)}ctx.save();ctx.translate(x,y);ctx.scale(s,s);for(let i=0;i<state.layers.length;i++){const L=state.layers[i],a=assetById(L.assetId);if(!a||!L.visible)continue;ctx.save();ctx.globalAlpha=L.opacity;ctx.translate(L.x,L.y);ctx.rotate(L.rot*Math.PI/180);ctx.scale(L.flip?-L.scale:L.scale,L.scale);ctx.drawImage(a.img,-a.w/2,-a.h/2,a.w,a.h);if(i===state.selectedLayer){ctx.globalAlpha=1;ctx.strokeStyle='#ef6035';ctx.lineWidth=2/s;ctx.setLineDash([8/s,5/s]);ctx.strokeRect(-a.w/2,-a.h/2,a.w,a.h);ctx.setLineDash([])}ctx.restore()}ctx.restore()}
function screenToImg(p){return{x:(p.x-state.view.x)/state.view.scale,y:(p.y-state.view.y)/state.view.scale}}
function imgToScreen(p){return{x:state.view.x+p.x*state.view.scale,y:state.view.y+p.y*state.view.scale}}
function evtPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function toolHint(){return state.tool==='rect'?'ドラッグして矩形を作成':state.tool==='polygon'?'クリックで輪郭点を追加 / ダブルクリックで確定':state.tool==='free'?'ドラッグで自由に囲む':'ドラッグして表示位置を移動'}
$$('.tool').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;$$('.tool').forEach(x=>x.classList.toggle('active',x===b));$('#hint').textContent=toolHint();state.poly=[];state.free=[];draw()});
let lastPan=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=evtPos(e);if(state.mode==='compose'){const q=screenToImg(p);const idx=hitLayer(q.x,q.y);if(idx>=0){state.selectedLayer=idx;state.dragLayer={sx:q.x,sy:q.y,ox:state.layers[idx].x,oy:state.layers[idx].y};renderLayers();syncLayerEditor();draw()}return}if(state.tool==='pan'){lastPan=p;return}const q=screenToImg(p);if(state.tool==='rect'){state.drawing=true;state.selection={type:'rect',x:q.x,y:q.y,w:0,h:0};}else if(state.tool==='polygon'){state.poly.push(q);draw()}else if(state.tool==='free'){state.drawing=true;state.free=[q];}});
canvas.addEventListener('pointermove',e=>{const p=evtPos(e);if(state.mode==='compose'&&state.dragLayer){const q=screenToImg(p),L=state.layers[state.selectedLayer];L.x=state.dragLayer.ox+(q.x-state.dragLayer.sx);L.y=state.dragLayer.oy+(q.y-state.dragLayer.sy);syncLayerEditor();draw();return}if(state.mode!=='crop')return;if(state.tool==='pan'&&lastPan){state.view.x+=p.x-lastPan.x;state.view.y+=p.y-lastPan.y;lastPan=p;draw();return}if(!state.drawing)return;const q=screenToImg(p);if(state.tool==='rect'){state.selection.w=q.x-state.selection.x;state.selection.h=q.y-state.selection.y;updateSelectionInfo();draw()}else if(state.tool==='free'){state.free.push(q);draw()}});
canvas.addEventListener('pointerup',e=>{if(state.mode==='compose'){state.dragLayer=null;return}lastPan=null;if(state.tool==='rect'&&state.drawing){state.drawing=false;normalizeRect();updateSelectionInfo();draw()}else if(state.tool==='free'&&state.drawing){state.drawing=false;if(state.free.length>2)state.selection={type:'poly',points:simplify(state.free,2.5)};state.free=[];updateSelectionInfo();draw()}});
canvas.addEventListener('dblclick',e=>{if(state.mode==='crop'&&state.tool==='polygon'&&state.poly.length>2){state.selection={type:'poly',points:[...state.poly]};state.poly=[];updateSelectionInfo();draw()}});
addEventListener('keydown',e=>{if(e.key==='Enter'&&state.mode==='crop'&&state.tool==='polygon'&&state.poly.length>2){state.selection={type:'poly',points:[...state.poly]};state.poly=[];updateSelectionInfo();draw()}if((e.key==='Delete'||e.key==='Backspace')&&state.mode==='compose'&&state.selectedLayer!=null&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){deleteLayer()}})
function normalizeRect(){let r=state.selection;if(!r||r.type!=='rect')return;if(r.w<0){r.x+=r.w;r.w=-r.w}if(r.h<0){r.y+=r.h;r.h=-r.h}}
function selectionScreenPath(sel){if(sel.type==='rect'){const a=imgToScreen({x:sel.x,y:sel.y});return{type:'rect',x:a.x,y:a.y,w:sel.w*state.view.scale,h:sel.h*state.view.scale}}return{type:'poly',points:sel.points.map(imgToScreen)}}
function pathToCtx(p){if(p.type==='rect'){ctx.rect(p.x,p.y,p.w,p.h)}else{p.points.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath()}}
function updateSelectionInfo(){const b=selBounds();$('#selX').textContent=b?Math.round(b.x):'-';$('#selY').textContent=b?Math.round(b.y):'-';$('#selW').textContent=b?Math.round(b.w):'-';$('#selH').textContent=b?Math.round(b.h):'-'}

function hitLayer(x,y){for(let i=state.layers.length-1;i>=0;i--){const L=state.layers[i],a=assetById(L.assetId);if(!L.visible||!a)continue;const dx=x-L.x,dy=y-L.y,c=Math.cos(-L.rot*Math.PI/180),s=Math.sin(-L.rot*Math.PI/180);let lx=(dx*c-dy*s)/(L.scale*(L.flip?-1:1)),ly=(dx*s+dy*c)/L.scale;if(Math.abs(lx)<=a.w/2&&Math.abs(ly)<=a.h/2)return i}return -1}

$('#assetUploadBtn').onclick=()=>$('#assetUpload').click();$('#assetUpload').onchange=e=>loadAssetFiles(e.target.files);const drop=$('#assetDrop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>loadAssetFiles(e.dataTransfer.files);async function loadAssetFiles(files){for(const f of files){const url=URL.createObjectURL(f),img=await imgFrom(url);state.assets.push({id:'asset_'+crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),url,img,w:img.naturalWidth,h:img.naturalHeight,file:f})}renderAssets();toast(files.length+'個の素材を追加')}
function autoDetectComponents(){if(!state.source)return;status('自動分割中...');const im=state.source.img,c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);const dat=g.getImageData(0,0,c.width,c.height).data,W=c.width,H=c.height,thr=+$('#alphaThreshold').value;const ds=3,w=Math.ceil(W/ds),h=Math.ceil(H/ds),mask=new Uint8Array(w*h);for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){let a=0;for(let sy=0;sy<ds;sy++)for(let sx=0;sx<ds;sx++){const x=Math.min(W-1,xx*ds+sx),y=Math.min(H-1,yy*ds+sy);a=Math.max(a,dat[(y*W+x)*4+3])}if(a>thr)mask[yy*w+xx]=1}const seen=new Uint8Array(w*h),comps=[];const qx=new Int32Array(w*h),qy=new Int32Array(w*h);for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){let idx=yy*w+xx;if(!mask[idx]||seen[idx])continue;let qs=0,qe=0;qx[qe]=xx;qy[qe++]=yy;seen[idx]=1;let minx=xx,maxx=xx,miny=yy,maxy=yy,count=0;while(qs<qe){const x=qx[qs],y=qy[qs++];count++;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);const ns=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];for(const [nx,ny] of ns){if(nx<0||ny<0||nx>=w||ny>=h)continue;const ni=ny*w+nx;if(mask[ni]&&!seen[ni]){seen[ni]=1;qx[qe]=nx;qy[qe++]=ny}}}if(count>40)comps.push({x:minx*ds,y:miny*ds,w:(maxx-minx+1)*ds,h:(maxy-miny+1)*ds,count})}comps.sort((a,b)=>b.count-a.count);state.detected=comps.slice(0,60);renderDetected();status('自動分割完了: '+state.detected.length+'候補')}
$('#autoDetect').onclick=autoDetectComponents;function renderDetected(){const box=$('#detectedList');box.innerHTML='';state.detected.forEach((b,i)=>{const c=document.createElement('canvas');c.width=b.w;c.height=b.h;c.getContext('2d').drawImage(state.source.img,b.x,b.y,b.w,b.h,0,0,b.w,b.h);const d=document.createElement('div');d.className='asset-card';d.innerHTML=`<img src="${c.toDataURL()}"><b>候補 ${i+1}</b>`;d.onclick=()=>{state.selection={type:'rect',x:b.x,y:b.y,w:b.w,h:b.h};$('#assetName').value='asset_'+(i+1);updateSelectionInfo();draw()};box.appendChild(d)})}
$('#trimAlpha').onclick=()=>{const cr=cropCanvasFromSelection();if(!cr)return;const g=cr.canvas.getContext('2d',{willReadFrequently:true}),id=g.getImageData(0,0,cr.w,cr.h),thr=+$('#alphaThreshold').value;let minx=cr.w,miny=cr.h,maxx=-1,maxy=-1;for(let y=0;y<cr.h;y++)for(let x=0;x<cr.w;x++)if(id.data[(y*cr.w+x)*4+3]>thr){minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)}if(maxx<0)return;state.selection={type:'rect',x:cr.x+minx,y:cr.y+miny,w:maxx-minx+1,h:maxy-miny+1};updateSelectionInfo();draw()};

$('#exportGame').onclick=async()=>{status('ZIPを作成中...');const entries=[];const manifest={format:'kani-dish-assets-v1',canvas:{width:state.dish.w,height:state.dish.h},assets:[],recipes:state.recipes};for(const a of state.assets){let blob;if(a.file)blob=a.file;else if(a.pngDataUrl)blob=dataUrlToBlob(a.pngDataUrl);else continue;const fn=safe(a.name)+'.png';entries.push({name:'assets/'+fn,data:new Uint8Array(await blob.arrayBuffer())});manifest.assets.push({id:a.id,name:a.name,file:'assets/'+fn,width:a.w,height:a.h})}entries.push({name:'dish_assets.json',data:new TextEncoder().encode(JSON.stringify(manifest,null,2))});entries.push({name:'README.txt',data:new TextEncoder().encode('dish_assets.json と assets/ をゲームへコピーしてください。recipes 内の layers は x/y/scale/rot/opacity/flip と assetId を保持しています。\n')});const zip=makeZip(entries);downloadBlob(new Blob([zip],{type:'application/zip'}),'kani_game_assets.zip');status('ゲーム用ZIPを書き出しました');toast('ゲーム用ZIPを保存しました')};
function makeZip(entries){const parts=[],central=[];let offset=0;for(const e of entries){const name=new TextEncoder().encode(e.name),data=e.data,crc=crc32(data);const local=new Uint8Array(30+name.length+data.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0,true);v.setUint16(8,0,true);v.setUint16(10,0,true);v.setUint16(12,0,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);v.setUint16(28,0,true);local.set(name,30);local.set(data,30+name.length);parts.push(local);const cen=new Uint8Array(46+name.length),c=new DataView(cen.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,offset,true);cen.set(name,46);central.push(cen);offset+=local.length}const centralSize=central.reduce((n,a)=>n+a.length,0),end=new Uint8Array(22),d=new DataView(end.buffer);d.setUint32(0,0x06054b50,true);d.setUint16(4,0,true);d.setUint16(6,0,true);d.setUint16(8,entries.length,true);d.setUint16(10,entries.length,true);d.setUint32(12,centralSize,true);d.setUint32(16,offset,true);d.setUint16(20,0,true);return concat([...parts,...central,end])}
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(arr){let c=0xffffffff;for(const b of arr)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function concat(arrs){const n=arrs.reduce((s,a)=>s+a.length,0),out=new Uint8Array(n);let o=0;for(const a of arrs){out.set(a,o);o+=a.length}return out}
function downloadCanvas(c,name){c.toBlob(b=>downloadBlob(b,name),'image/png')}function downloadBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function dataUrlToBlob(u){const [h,d]=u.split(','),m=h.match(/:(.*?);/)[1],bin=atob(d),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}function safe(s){return s.replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'asset'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
