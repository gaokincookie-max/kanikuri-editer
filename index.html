<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カニ料理プレビューエディタ v14</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>カニ料理プレビューエディタ <span>v14</span></h1>
      <div class="panel">
        <h2>テンプレート</h2>
        <label>プロジェクト<select id="templateSelect"></select></label>
        <div class="row2">
          <button id="loadProjectBtn">JSON読込</button>
          <button id="loadLayoutBtn">レイアウト読込</button>
        </div>
      </div>
      <div class="panel">
        <h2>パターン</h2>
        <label>ソース<select id="sauceSelect"></select></label>
        <label>具材<select id="mainSelect"></select></label>
        <label>焼き加減<select id="burnSelect"></select></label>
        <label>焦げオーバーレイ透明度 <input id="burnAlpha" type="range" min="0" max="100" value="70"></label>
        <div class="smallVal" id="burnAlphaValue">70%</div>
        <div class="checks">
          <label><input id="legsToggle" type="checkbox">足</label>
          <label><input id="glassesToggle" type="checkbox">グラサン</label>
          <label><input id="headphonesToggle" type="checkbox">ヘッドホン</label>
          <label><input id="steamToggle" type="checkbox">湯気</label>
          <label><input id="sparkleToggle" type="checkbox">キラキラ</label>
        </div>
      </div>
      <div class="panel">
        <h2>焼き素材メモ</h2>
        <p>今回追加した焦げ素材は、<b>焼き加減</b>から切り替えできます。透明度は上のスライダーで調整できます。</p>
        <ul>
          <li>奇跡の火入れ</li>
          <li>香ばしい焦げ</li>
          <li>真っ黒焦げ</li>
        </ul>
      </div>
      <div class="panel">
        <h2>書き出し</h2>
        <div class="row2">
          <button id="saveLayoutBtn">レイアウト保存</button>
          <button id="saveProjectBtn">プロジェクト保存</button>
        </div>
      </div>
      <div class="panel">
        <h2>素材</h2>
        <details>
          <summary>追加した焼き素材シート</summary>
          <img class="sheetPreview" src="assets/overlays/overlay_sheet.png" alt="焦げ素材シート">
        </details>
      </div>
      <input id="hiddenFile" type="file" accept=".json,application/json" hidden>
    </aside>
    <main class="main">
      <div class="toolbar">
        <span>プレビュー</span>
        <div class="legend">※ 今回は焼き加減切替に対応した版です</div>
      </div>
      <div class="canvasWrap">
        <canvas id="preview" width="760" height="760"></canvas>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
