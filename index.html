<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>料理アセット調整ツール v4</title>
<style>
:root{--bg:#f6f0e3;--panel:#fffdf8;--line:#ddd3c2;--ink:#2a261f;--sub:#6f685d;--accent:#e85d2a;--accent2:#2563eb;--shadow:0 8px 24px rgba(87,60,23,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic UI","Hiragino Sans",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}button:hover{background:#fff7f0}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.blue{background:var(--accent2);color:#fff;border-color:var(--accent2)}
header{height:60px;background:#2f2a25;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.18)}header h1{margin:0;font-size:16px;font-weight:800}.spacer{flex:1}
main{padding:10px;display:grid;grid-template-columns:340px minmax(420px,1fr) 340px;gap:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panelTitle{padding:12px 14px;border-bottom:1px solid var(--line);background:#fcf7ef;font-size:13px;font-weight:800}.panelBody{padding:10px;overflow:auto;max-height:calc(100vh - 90px)}.section{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.section:first-child{border-top:0;margin-top:0;padding-top:0}.sectionTitle{font-size:12px;font-weight:800;margin-bottom:8px}.small{font-size:11px;color:var(--sub);line-height:1.45}.note{padding:8px 10px;background:#fff7ed;border:1px solid #f3d7b8;border-radius:10px;font-size:11px;line-height:1.5}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}select,input[type=number]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stagePanel{display:flex;flex-direction:column}.stageTop{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stageWrap{display:flex;align-items:center;justify-content:center;padding:10px;background:linear-gradient(45deg,#ece6da 25%,transparent 25%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ece6da 75%) 0 0/20px 20px,linear-gradient(45deg,transparent 75%,#ece6da 75%) 10px -10px/20px 20px,linear-gradient(45deg,#ece6da 25%,#f9f6f0 25%) 10px -10px/20px 20px;min-height:760px;overflow:auto}#previewCanvas{max-width:100%;height:auto;touch-action:none;background:transparent;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.props{display:grid;grid-template-columns:82px 1fr 58px;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}.props input[type=range]{width:100%}.layerList{display:flex;flex-direction:column;gap:6px}.layerItem{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.layerItem.sel{outline:2px solid rgba(232,93,42,.5);background:#fff7f3}.layerName{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{padding:4px 7px;font-size:11px;border-radius:7px}.eye{padding:0;width:22px;height:22px}.assetGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.assetCard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;cursor:pointer}.assetCard canvas{width:100%;height:68px;display:block}.assetCard span{display:block;font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comboGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.comboCard{border:1px solid var(--line);border-radius:12px;padding:6px;background:white;cursor:pointer}.comboCard canvas{width:100%;height:auto;background:#fbf7ef;border-radius:8px}.comboCard .cap{font-size:11px;line-height:1.3;margin-top:5px;text-align:center}
@media(max-width:1180px){main{grid-template-columns:1fr}.panelBody{max-height:none}.stageWrap{min-height:60vh}}
</style></head><body>
<header><h1>🍽 カニ・クリーム・コロッケ 組み合わせプレビュー＆調整ツール v4</h1><div class="spacer"></div><button id="exportJsonBtn">JSON保存</button><button id="importJsonBtn">JSON読込</button><button id="exportPngBtn" class="primary">PNG保存</button><input id="jsonFile" type="file" accept="application/json" hidden></header>
<main>
<aside class="panel"><div class="panelTitle">組み合わせ・全体補正</div><div class="panelBody">
<div class="section"><div class="sectionTitle">基本パターン</div><div class="grid2"><div><label>液体</label><select id="sauceSelect"></select></div><div><label>具材</label><select id="mainSelect"></select></div><div><label>焼き具合</label><select id="finishSelect"></select></div><div><label>並び</label><select id="layoutSelect"><option value="standard">標準</option><option value="ingredientFocus">具材を強調</option><option value="sauceFocus">液体を強調</option></select></div></div><div class="grid3" style="margin-top:8px"><label class="check"><input type="checkbox" id="legsCheck">足</label><label class="check"><input type="checkbox" id="glassCheck">グラサン</label><label class="check"><input type="checkbox" id="headphoneCheck">ヘッドホン</label><label class="check"><input type="checkbox" id="steamCheck">湯気</label><label class="check"><input type="checkbox" id="sparkleCheck">キラキラ</label></div><div class="row" style="margin-top:8px"><button id="applyBasePreset" class="blue">原案を反映</button><button id="resetLayoutBtn">位置を初期化</button></div></div>
<div class="section"><div class="sectionTitle">全体補正</div><div class="note">ゲーム本体でも同じ Canvas レンダラーを使う前提です。まずは「カニ＋クリーム」を基準に合わせて、テンプレ保存するのがおすすめです。</div><div id="globalControls"></div><div class="row" style="margin-top:8px"><button id="applyGlobalBtn" class="blue">全体補正を反映</button><button id="resetGlobalBtn">全体補正を初期化</button></div></div>
<div class="section"><div class="sectionTitle">テンプレート</div><div class="row"><button id="saveTemplateBtn">テンプレ保存</button><button id="loadTemplateBtn">テンプレ読込</button><button id="clearTemplateBtn">削除</button></div></div>
<div class="section"><div class="sectionTitle">全パターン一覧</div><div class="row"><button id="buildComboGrid" class="blue">一覧を生成 / 更新</button></div><div id="comboGrid" class="comboGrid" style="margin-top:8px"></div></div>
</div></aside>
<section class="panel stagePanel"><div class="stageTop"><strong>Canvas プレビュー</strong><span class="small">この描画処理は、同梱の game_renderer_example.html でも同じものを使っています。</span></div><div class="stageWrap"><canvas id="previewCanvas" width="760" height="760"></canvas></div></section>
<aside class="panel"><div class="panelTitle">レイヤー調整・素材差し替え</div><div class="panelBody"><div id="layerList" class="layerList"></div><div class="section"><div class="sectionTitle">選択レイヤー</div><div id="layerNone" class="small">レイヤーを選択してください。</div><div id="layerProps" hidden><div class="props"><label>X</label><input id="xRange" type="range" min="-200" max="960"><input id="xNum" type="number"></div><div class="props"><label>Y</label><input id="yRange" type="range" min="-200" max="960"><input id="yNum" type="number"></div><div class="props"><label>拡大率</label><input id="scaleRange" type="range" min="0.05" max="3" step="0.01"><input id="scaleNum" type="number" step="0.01"></div><div class="props"><label>回転</label><input id="rotRange" type="range" min="-180" max="180"><input id="rotNum" type="number"></div><div class="props"><label>透明度</label><input id="alphaRange" type="range" min="0" max="1" step="0.01"><input id="alphaNum" type="number" step="0.01"></div><div class="row"><label class="check"><input id="flipX" type="checkbox">左右反転</label><label class="check"><input id="clipCheck" type="checkbox">断面内にクリップ</label></div><div class="row"><button id="dupLayerBtn" class="mini">複製</button><button id="delLayerBtn" class="mini">削除</button></div></div></div>
<div class="section"><div class="sectionTitle">素材ライブラリ</div><div class="row" style="margin:8px 0"><button class="mini libTab blue" data-cat="base">土台</button><button class="mini libTab" data-cat="sauce">液体</button><button class="mini libTab" data-cat="main">具材</button><button class="mini libTab" data-cat="extra">装飾</button></div><div id="assetGrid" class="assetGrid"></div></div>
<div class="section"><div class="sectionTitle">断面マスク</div><div class="props"><label>中心X</label><input id="maskX" type="range" min="0" max="760"><input id="maskXn" type="number"></div><div class="props"><label>中心Y</label><input id="maskY" type="range" min="0" max="760"><input id="maskYn" type="number"></div><div class="props"><label>横半径</label><input id="maskRX" type="range" min="20" max="320"><input id="maskRXn" type="number"></div><div class="props"><label>縦半径</label><input id="maskRY" type="range" min="20" max="260"><input id="maskRYn" type="number"></div><label class="check"><input id="showMask" type="checkbox">断面マスクを表示</label></div>
</div></aside>
</main>
<script src="renderer.js"></script>
<script>
const R=window.KaniDishRenderer; const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const state={images:{}, selected:null, layers:[], mask:R.createDefaultMask(), global:R.createDefaultGlobal(), showMask:false, libCat:'base'};
const canvas=$('#previewCanvas'), ctx=canvas.getContext('2d'); let uidCounter=1;
function loadImage(src){return new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;});}
function recipeFromControls(){return {sauce:$('#sauceSelect').value, main:$('#mainSelect').value, finish:$('#finishSelect').value, layout:$('#layoutSelect').value, legs:$('#legsCheck').checked, glasses:$('#glassCheck').checked, headphones:$('#headphoneCheck').checked, steam:$('#steamCheck').checked, sparkle:$('#sparkleCheck').checked};}
function setControls(recipe){$('#sauceSelect').value=recipe.sauce; $('#mainSelect').value=recipe.main; $('#finishSelect').value=recipe.finish; $('#layoutSelect').value=recipe.layout; $('#legsCheck').checked=!!recipe.legs; $('#glassCheck').checked=!!recipe.glasses; $('#headphoneCheck').checked=!!recipe.headphones; $('#steamCheck').checked=!!recipe.steam; $('#sparkleCheck').checked=!!recipe.sparkle;}
function rebuildFromRecipe(recipe=recipeFromControls()){state.layers=R.buildRecipeLayers(recipe, state.global, state.mask).map(l=>({...l,uid:'l'+uidCounter++})); state.selected=state.layers.at(-1)?.uid||null; syncLayerList(); syncProps(); draw();}
function draw(){R.renderDish(ctx,state.images,{layers:state.layers,mask:state.mask,recipe:recipeFromControls()},{showMask:state.showMask});}
function syncSelectOptions(){ $('#sauceSelect').innerHTML=R.defs.sauces.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); $('#mainSelect').innerHTML=R.defs.mains.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); $('#finishSelect').innerHTML=`<option value="normal">通常</option><option value="golden">こんがり</option><option value="burnt">焦げ</option><option value="charcoal">丸焦げ</option>`; $('#layoutSelect').value='standard'; }
function getLayer(){return state.layers.find(l=>l.uid===state.selected)||null;} function sortedLayers(){return [...state.layers].sort((a,b)=>a.z-b.z);} 
function syncLayerList(){const box=$('#layerList'); box.innerHTML=''; sortedLayers().forEach(l=>{const div=document.createElement('div'); div.className='layerItem'+(l.uid===state.selected?' sel':''); div.innerHTML=`<button class="eye mini" data-eye="${l.uid}">${l.visible?'👁':'🚫'}</button><div class="layerName">${l.name}</div><div class="row"><button class="mini" data-up="${l.uid}">↑</button><button class="mini" data-down="${l.uid}">↓</button></div>`; div.onclick=e=>{if(e.target.closest('button')) return; state.selected=l.uid; syncLayerList(); syncProps(); draw();}; box.appendChild(div);}); $$('[data-eye]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const l=state.layers.find(x=>x.uid===b.dataset.eye); l.visible=!l.visible; syncLayerList(); draw();}); $$('[data-up]').forEach(b=>b.onclick=e=>{e.stopPropagation(); shiftLayer(b.dataset.up,1);}); $$('[data-down]').forEach(b=>b.onclick=e=>{e.stopPropagation(); shiftLayer(b.dataset.down,-1);}); }
function shiftLayer(uid,dir){const layers=sortedLayers(); const idx=layers.findIndex(l=>l.uid===uid); const target=idx+dir; if(target<0||target>=layers.length)return; const a=layers[idx], b=layers[target]; [a.z,b.z]=[b.z,a.z]; syncLayerList(); draw(); }
function bindNumRange(id, getter, setter){$('#'+id+'Range').oninput=e=>{setter(Number(e.target.value)); syncProps(); draw();}; $('#'+id+'Num').oninput=e=>{setter(Number(e.target.value)); syncProps(); draw();};}
function syncProps(){ const l=getLayer(); $('#layerNone').hidden=!!l; $('#layerProps').hidden=!l; if(l){ [['x',l.x],['y',l.y],['scale',l.scale],['rot',l.rotation],['alpha',l.alpha]].forEach(([k,v])=>{$('#'+k+'Range').value=v; $('#'+k+'Num').value=v;}); $('#flipX').checked=!!l.flipX; $('#clipCheck').checked=!!l.clip; } [['maskX','x'],['maskY','y'],['maskRX','rx'],['maskRY','ry']].forEach(([id,key])=>{$('#'+id).value=state.mask[key]; $('#'+id+'n').value=state.mask[key];}); $('#showMask').checked=state.showMask; syncGlobalControls(); }
bindNumRange('x',()=>getLayer()?.x,v=>{const l=getLayer(); if(l) l.x=v;}); bindNumRange('y',()=>getLayer()?.y,v=>{const l=getLayer(); if(l) l.y=v;}); bindNumRange('scale',()=>getLayer()?.scale,v=>{const l=getLayer(); if(l) l.scale=v;}); bindNumRange('rot',()=>getLayer()?.rotation,v=>{const l=getLayer(); if(l) l.rotation=v;}); bindNumRange('alpha',()=>getLayer()?.alpha,v=>{const l=getLayer(); if(l) l.alpha=v;});
$('#flipX').onchange=e=>{const l=getLayer(); if(l){l.flipX=e.target.checked; draw();}}; $('#clipCheck').onchange=e=>{const l=getLayer(); if(l){l.clip=e.target.checked; draw();}}; $('#dupLayerBtn').onclick=()=>{const l=getLayer(); if(!l) return; state.layers.push({...l,uid:'l'+uidCounter++,x:l.x+12,y:l.y+12,name:l.name+' 複製'}); syncLayerList(); draw();}; $('#delLayerBtn').onclick=()=>{state.layers=state.layers.filter(x=>x.uid!==state.selected); state.selected=state.layers.at(-1)?.uid||null; syncLayerList(); syncProps(); draw();};
[['maskX','x'],['maskY','y'],['maskRX','rx'],['maskRY','ry']].forEach(([id,key])=>{const f=v=>{state.mask[key]=Number(v); syncProps(); draw();}; $('#'+id).oninput=e=>f(e.target.value); $('#'+id+'n').oninput=e=>f(e.target.value);}); $('#showMask').onchange=e=>{state.showMask=e.target.checked; draw();};
function makeGlobalControls(){const box=$('#globalControls'); const groups=[['plate','皿'],['body','本体'],['sauce','液体'],['main','具材'],['extra','装飾']]; box.innerHTML=''; groups.forEach(([g,label])=>{const sec=document.createElement('div'); sec.className='section'; sec.innerHTML=`<div class="sectionTitle">${label}</div><div class="props"><label>X補正</label><input id="g_${g}_x" type="range" min="-180" max="180"><input id="g_${g}_x_n" type="number"></div><div class="props"><label>Y補正</label><input id="g_${g}_y" type="range" min="-180" max="180"><input id="g_${g}_y_n" type="number"></div><div class="props"><label>拡大率</label><input id="g_${g}_s" type="range" min="0.4" max="1.8" step="0.01"><input id="g_${g}_s_n" type="number" step="0.01"></div>`; box.appendChild(sec); ['x','y'].forEach(k=>{const a=sec.querySelector(`#g_${g}_${k}`), b=sec.querySelector(`#g_${g}_${k}_n`); const set=v=>{state.global[g][k]=Number(v); a.value=v; b.value=v;}; a.oninput=e=>set(e.target.value); b.oninput=e=>set(e.target.value);}); const a=sec.querySelector(`#g_${g}_s`), b=sec.querySelector(`#g_${g}_s_n`); const set=v=>{state.global[g].scale=Number(v); a.value=v; b.value=v;}; a.oninput=e=>set(e.target.value); b.oninput=e=>set(e.target.value);}); }
function syncGlobalControls(){ ['plate','body','sauce','main','extra'].forEach(g=>{ if($('#g_'+g+'_x')){ $('#g_'+g+'_x').value=state.global[g].x; $('#g_'+g+'_x_n').value=state.global[g].x; $('#g_'+g+'_y').value=state.global[g].y; $('#g_'+g+'_y_n').value=state.global[g].y; $('#g_'+g+'_s').value=state.global[g].scale; $('#g_'+g+'_s_n').value=state.global[g].scale; }}); }
$('#applyGlobalBtn').onclick=()=>rebuildFromRecipe(); $('#resetGlobalBtn').onclick=()=>{state.global=R.createDefaultGlobal(); syncGlobalControls(); rebuildFromRecipe();};
function renderAssetGrid(){const grid=$('#assetGrid'); const list= state.libCat==='base' ? [R.assetMap.plate,R.assetMap.whole,R.assetMap.cutFrame] : state.libCat==='sauce' ? R.defs.sauces : state.libCat==='main' ? R.defs.mains : [R.assetMap.shoeL,R.assetMap.shoeR,R.assetMap.glasses,R.assetMap.headphones,R.assetMap.steam,R.assetMap.sparkle]; grid.innerHTML=''; list.forEach(def=>{const card=document.createElement('div'); card.className='assetCard'; const cv=document.createElement('canvas'); cv.width=100; cv.height=68; const x=cv.getContext('2d'); const img=state.images[def.sheet]; const r=Math.min((100-8)/def.sw,(68-8)/def.sh); const dw=def.sw*r, dh=def.sh*r; x.drawImage(img,def.sx,def.sy,def.sw,def.sh,(100-dw)/2,(68-dh)/2,dw,dh); card.appendChild(cv); const sp=document.createElement('span'); sp.textContent=def.name; card.appendChild(sp); card.onclick=()=>{const l=getLayer(); if(!l){ alert('先にレイヤーを選択してください。'); return;} l.assetId=def.id; l.name=def.name; if(R.defs.sauces.some(s=>s.id===def.id)||R.defs.mains.some(m=>m.id===def.id)) l.clip=true; syncLayerList(); draw();}; grid.appendChild(card);}); }
$$('.libTab').forEach(btn=>btn.onclick=()=>{$$('.libTab').forEach(b=>b.classList.remove('blue')); btn.classList.add('blue'); state.libCat=btn.dataset.cat; renderAssetGrid();});
function renderComboGrid(){const box=$('#comboGrid'); box.innerHTML=''; const current=recipeFromControls(); R.defs.mains.forEach(main=>R.defs.sauces.forEach(sauce=>{ const c=document.createElement('div'); c.className='comboCard'; const cv=document.createElement('canvas'); cv.width=220; cv.height=170; const x=cv.getContext('2d'); R.drawDishThumbnail(x,state.images,{...current, main:main.id, sauce:sauce.id},state.global,220,170); c.appendChild(cv); const cap=document.createElement('div'); cap.className='cap'; cap.textContent=`${main.name} × ${sauce.name}`; c.appendChild(cap); c.onclick=()=>{ $('#mainSelect').value=main.id; $('#sauceSelect').value=sauce.id; rebuildFromRecipe(); }; box.appendChild(c); })); }
let drag=null; function canvasPoint(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height}; }
function hitLayer(pt){ const list=sortedLayers().slice().reverse(); for(const l of list){ if(l.visible===false) continue; const def=R.assetMap[l.assetId]; const dw=def.sw*l.scale, dh=def.sh*l.scale; if(Math.abs(pt.x-l.x)<=dw/2 && Math.abs(pt.y-l.y)<=dh/2) return l; } return null; }
canvas.addEventListener('pointerdown',e=>{ const pt=canvasPoint(e); const l=hitLayer(pt); if(l){ state.selected=l.uid; syncLayerList(); syncProps(); drag={uid:l.uid,dx:pt.x-l.x,dy:pt.y-l.y}; canvas.setPointerCapture(e.pointerId); draw(); } });
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const pt=canvasPoint(e); const l=state.layers.find(x=>x.uid===drag.uid); if(!l) return; l.x=pt.x-drag.dx; l.y=pt.y-drag.dy; syncProps(); draw(); }); canvas.addEventListener('pointerup',()=>drag=null); canvas.addEventListener('pointerleave',()=>drag=null);
function downloadBlob(blob,name){const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);} 
$('#exportPngBtn').onclick=()=>{R.renderDish(ctx,state.images,{layers:state.layers,mask:state.mask,recipe:recipeFromControls()},{backgroundFill:'#fff'}); canvas.toBlob(b=>downloadBlob(b,'dish-preview.png'),'image/png'); setTimeout(draw,30);};
$('#exportJsonBtn').onclick=()=>{const data={format:'kani-dish-v4',global:state.global,mask:state.mask,recipe:recipeFromControls(),layers:state.layers.map(({uid,...rest})=>rest)}; downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'kani-dish-layout-v4.json');};
$('#importJsonBtn').onclick=()=>$('#jsonFile').click(); $('#jsonFile').onchange=async e=>{ try{ const obj=JSON.parse(await e.target.files[0].text()); state.global=Object.assign(R.createDefaultGlobal(), obj.global||{}); state.mask=Object.assign(R.createDefaultMask(), obj.mask||{}); setControls(Object.assign({}, R.defaultRecipe, obj.recipe||{})); state.layers=(obj.layers||[]).map(l=>({...l,uid:'l'+uidCounter++})); state.selected=state.layers.at(-1)?.uid||null; syncLayerList(); syncProps(); draw(); } catch(err){ alert(err.message); } };
$('#applyBasePreset').onclick=()=>rebuildFromRecipe(); $('#resetLayoutBtn').onclick=()=>rebuildFromRecipe(); $('#buildComboGrid').onclick=renderComboGrid;
$('#saveTemplateBtn').onclick=()=>{localStorage.setItem('kaniDishTemplateV4', JSON.stringify({global:state.global,mask:state.mask,recipe:recipeFromControls(),layers:state.layers.map(({uid,...rest})=>rest)})); alert('テンプレ保存しました。');};
$('#loadTemplateBtn').onclick=()=>{const t=localStorage.getItem('kaniDishTemplateV4'); if(!t){alert('保存済みテンプレートがありません。'); return;} const obj=JSON.parse(t); state.global=Object.assign(R.createDefaultGlobal(), obj.global||{}); state.mask=Object.assign(R.createDefaultMask(), obj.mask||{}); setControls(Object.assign({}, R.defaultRecipe, obj.recipe||{})); state.layers=(obj.layers||[]).map(l=>({...l,uid:'l'+uidCounter++})); state.selected=state.layers.at(-1)?.uid||null; syncLayerList(); syncProps(); draw();};
$('#clearTemplateBtn').onclick=()=>{localStorage.removeItem('kaniDishTemplateV4'); alert('削除しました。');};
(async function init(){ state.images.base=await loadImage('assets/croquette_sheet.png'); state.images.fill=await loadImage('assets/fill_sheet.png'); syncSelectOptions(); makeGlobalControls(); renderAssetGrid(); rebuildFromRecipe(R.defaultRecipe); renderComboGrid(); })();
</script></body></html>
