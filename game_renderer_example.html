<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Renderer Example v7</title><style>body{font-family:system-ui,sans-serif;background:#f6f0e3;margin:0;padding:16px}canvas{max-width:100%;height:auto;display:block;margin:16px auto;box-shadow:0 10px 30px rgba(0,0,0,.15);background:white}.wrap{max-width:900px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}select,button,input{font:inherit;padding:7px 9px}.small{font-size:12px;color:#555;line-height:1.5}</style></head><body><div class="wrap"><h1>ゲーム側 Canvas レンダラー v7 サンプル</h1><p class="small">調整ツールの「ゲーム取り込み用に全部書き出し」で作った <code>kani-dish-game-project-v7.json</code> を読み込み、複数テンプレートと複製した湯気などの追加レイヤーをそのまま再現します。</p><div class="row"><input id="projectFile" type="file" accept="application/json,.json"><select id="templateSelect"><option>プロジェクトを読み込んでください</option></select><button id="renderBtn">描画</button></div><canvas id="gameCanvas" width="760" height="760"></canvas></div><script src="renderer.js"></script><script>
const R=window.KaniDishRenderer,canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let images={},project=null;
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function applyOverrides(overrides){images=await R.loadDefaultImages(loadImage);for(const[id,url]of Object.entries(overrides||{}))if(url)images[id]=await loadImage(url);}
function normalizedExtras(arr){return(Array.isArray(arr)?arr:[]).map((e,i)=>({...e,uid:'extra_'+i,bound:false,role:e.semanticRole||e.role||'extra'}));}
function renderTemplate(t){if(!t)return;const base=R.buildRecipeLayers(t.recipe||R.defaultRecipe,t.slots||R.createDefaultSlots(),t.mask||R.createDefaultMask());const layers=[...base,...normalizedExtras(t.extraLayers)];R.renderDish(ctx,images,{layers,mask:t.mask||R.createDefaultMask(),recipe:t.recipe||R.defaultRecipe},{backgroundFill:'#fff'});}
document.getElementById('projectFile').onchange=async e=>{const obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='kani-dish-project-v7')return alert('v7ゲーム取り込み用JSONを選択してください。');project=obj;await applyOverrides(obj.overrides||{});const sel=document.getElementById('templateSelect');sel.innerHTML=(obj.templates||[]).map((t,i)=>`<option value="${i}">${t.name||('template '+(i+1))}</option>`).join('');renderTemplate(obj.templates?.[0]);};
document.getElementById('renderBtn').onclick=()=>{if(!project)return;renderTemplate(project.templates?.[Number(document.getElementById('templateSelect').value)||0]);};
(async()=>{images=await R.loadDefaultImages(loadImage);const t={slots:R.createDefaultSlots(),mask:R.createDefaultMask(),recipe:R.defaultRecipe,extraLayers:[]};renderTemplate(t);})();
</script></body></html>
